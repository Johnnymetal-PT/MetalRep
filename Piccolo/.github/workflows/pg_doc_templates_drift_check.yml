name: pg_doc_templates_drift_check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  drift-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Pull doc templates
        shell: pwsh
        env:
          PG_ODOO_KNOWLEDGE_TOKEN: ${{ secrets.PG_ODOO_KNOWLEDGE_TOKEN }}
          PG_ODOO_BASE_URL: ${{ secrets.PG_ODOO_BASE_URL }}
          PG_ODOO_DATABASE: ${{ secrets.PG_ODOO_DATABASE }}
          PG_ODOO_LOGIN: ${{ secrets.PG_ODOO_LOGIN }}
          PG_ODOO_WORKSPACE_XMLID: ${{ secrets.PG_ODOO_WORKSPACE_XMLID }}
        run: |
          ./scripts/pg_pull_doc_templates.ps1 `
            -BaseUrl $env:PG_ODOO_BASE_URL `
            -Database $env:PG_ODOO_DATABASE `
            -Login $env:PG_ODOO_LOGIN `
            -WorkspaceXmlId $env:PG_ODOO_WORKSPACE_XMLID

      - name: Fail on drift
        shell: pwsh
        run: |
          git config --global --add safe.directory "$PWD"
          $changes = git status --porcelain -- doc_templates
          if (-not [string]::IsNullOrWhiteSpace($changes)) {
            Write-Host "Drift detetado em doc_templates/:"
            Write-Host $changes
            exit 1
          }
          Write-Host "Sem drift em doc_templates/."